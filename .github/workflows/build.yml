name: Build MARSA Print Watcher Installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version: "1.24"

    - name: Embed manifest (wajib untuk lxn/walk)
      run: |
        go install github.com/akavel/rsrc@v0.10.2
        $rsrc = "$(go env GOPATH)\bin\rsrc.exe"
        # Coba sekalian tanam ikon ke .exe; kalau format ico ditolak, lanjut tanpa ikon
        & $rsrc -manifest watcher.manifest -ico icon.ico -o rsrc_windows_amd64.syso
        if ($LASTEXITCODE -ne 0) {
          Write-Host "rsrc dengan -ico gagal, ulangi tanpa ikon"
          & $rsrc -manifest watcher.manifest -o rsrc_windows_amd64.syso
          if ($LASTEXITCODE -ne 0) { exit 1 }
        }
      shell: pwsh

    - name: Build watcher.exe
      run: |
        go mod tidy
        go build -ldflags="-s -w -H windowsgui" -o installer/dist/watcher.exe

    - name: Install Inno Setup
      run: choco install innosetup -y
      shell: pwsh

    - name: Compile installer
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\watcher.iss
      shell: pwsh

    - uses: actions/upload-artifact@v4
      with:
        name: MarsaPrintWatcherSetup
        path: installer/output/MarsaPrintWatcherSetup.exe
